services:
  - type: web
    name: business-backend
    env: node
    plan: free
    buildCommand: |
      cd backend
      npm install
      cd ../frontend
      npm install
      npm run build
      cd ../backend
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        fromDatabase:
          name: mongodb
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false

databases:
  - name: mongodb
    databaseName: BUSINESS-COLLECTION
    plan: free
