services:
  - type: web
    name: business-backend
    env: node
    plan: free
    buildCommand: |
      cd frontend
      npm ci
      npm run build
      cd ../backend
      npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: https://your-frontend.onrender.com
      - key: BACKEND_URL
        value: https://your-backend.onrender.com
      - key: MONGODB_URI
        fromDatabase:
          name: mongodb
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false

databases:
  - name: mongodb
    databaseName: BUSINESS-COLLECTION
    plan: free
